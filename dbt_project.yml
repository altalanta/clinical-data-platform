name: "clinical_data_platform"
version: "0.1.0"
config-version: 2

profile: "clinical_platform"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data/seeds"]
macro-paths: ["macros"]
docs-paths: ["analyses"]
asset-paths: ["target"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raw_data_root: "{{ env_var('DBT_PROJECT_ROOT', '.') }}/data/raw"

models:
  clinical_data_platform:
    +materialized: table
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      survival:
        +schema: survival

seeds:
  clinical_data_platform:
    +schema: seeds
