global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@clinical-platform.com'
  smtp_auth_username: 'alerts@clinical-platform.com'
  smtp_auth_password: 'your-email-password'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    # Critical alerts go to on-call and Slack
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 30s
      repeat_interval: 5m
    
    # API-specific alerts
    - match:
        service: api
      receiver: 'api-alerts'
      group_interval: 30s
    
    # Data quality alerts
    - match:
        alertname: DataQualityFailure
      receiver: 'data-quality-alerts'
      group_interval: 1h
    
    # dbt pipeline alerts
    - match:
        job: dbt-exporter
      receiver: 'dbt-alerts'
      group_interval: 30m

receivers:
  - name: 'default'
    email_configs:
      - to: 'devops@clinical-platform.com'
        subject: 'Clinical Platform Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@clinical-platform.com'
        subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          CRITICAL ALERT TRIGGERED
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}
          
          Please investigate immediately.
    
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#critical-alerts'
        title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true

  - name: 'api-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#api-monitoring'
        title: 'API Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Endpoint:* {{ .Labels.endpoint }}
          *Status Code:* {{ .Labels.status_code }}
          {{ end }}

  - name: 'data-quality-alerts'
    email_configs:
      - to: 'data-team@clinical-platform.com'
        subject: 'Data Quality Alert: {{ .GroupLabels.alertname }}'
        body: |
          Data Quality Issue Detected
          
          {{ range .Alerts }}
          Dataset: {{ .Labels.dataset }}
          Test: {{ .Labels.test_name }}
          Description: {{ .Annotations.description }}
          Failure Rate: {{ .Labels.failure_rate }}
          {{ end }}
    
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#data-quality'
        title: 'Data Quality Alert'
        text: |
          {{ range .Alerts }}
          *Dataset:* {{ .Labels.dataset }}
          *Test:* {{ .Labels.test_name }}
          *Issue:* {{ .Annotations.description }}
          {{ end }}

  - name: 'dbt-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#dbt-pipeline'
        title: 'dbt Pipeline Alert'
        text: |
          {{ range .Alerts }}
          *Model:* {{ .Labels.model_name }}
          *Status:* {{ .Labels.status }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # Inhibit duplicate alerts for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']
  
  # Inhibit API alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '(HighLatency|HighErrorRate)'
    equal: ['service']